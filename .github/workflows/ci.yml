name: ci
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE", ".github/ISSUE_TEMPLATE/**", ".github/dependabot.yml"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE", ".github/ISSUE_TEMPLATE/**", ".github/dependabot.yml"]
  workflow_dispatch:
concurrency:                              # a newer push to the same ref cancels the older run
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  # One job: tests, cross-builds and (on main, for a new VERSION) the release. Building the three Pi
  # binaries takes seconds with the warm build cache, so every run proves they still build.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write                     # only used by the release step on main
    steps:
      - uses: actions/checkout@v5         # Node 24
      - uses: actions/setup-go@v7         # Node 24; caches the module and build cache
        with:
          go-version-file: go.mod
          cache: true
      - name: test
        run: ./test.sh
      - name: race + 32-bit vet
        run: go test -race ./... && GOARCH=386 go vet ./...
      - name: cross-build Pi binaries
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          [ "$GITHUB_REF" = refs/heads/main ] || v="$v-dev+${GITHUB_SHA::7}"
          out=dist; mkdir -p "$out"
          flags=(-trimpath -ldflags "-s -w -X main.version=$v")
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64       go build "${flags[@]}" -o "$out/piaccept-linux-arm64" ./cmd/piaccept
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build "${flags[@]}" -o "$out/piaccept-linux-armv7" ./cmd/piaccept
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=6 go build "${flags[@]}" -o "$out/piaccept-linux-armv6" ./cmd/piaccept
          (cd "$out" && sha256sum piaccept-* > SHA256SUMS && cat SHA256SUMS)
      # Release when VERSION names a tag that doesn't exist yet: raise VERSION + CHANGELOG in a PR,
      # merge it, and this makes the tag v<VERSION> and the release with the binaries.
      - name: release (main, new VERSION only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(tr -d '[:space:]' < VERSION)"
          if gh release view "$tag" >/dev/null 2>&1; then echo "$tag already released"; exit 0; fi
          notes=$(awk -v t="## $tag" '$0 ~ "^"t {f=1; next} /^## v/ {f=0} f' CHANGELOG.md)
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "$tag" \
            --notes "${notes:-See CHANGELOG.md.}"$'\n\n'"Pick the binary for your Pi's OS: \`dpkg --print-architecture\` → arm64 / armhf (armv7, or armv6 on Pi 1/Zero). Verify with \`sha256sum --ignore-missing -c SHA256SUMS\`."
          echo "released $tag" >> "$GITHUB_STEP_SUMMARY"
